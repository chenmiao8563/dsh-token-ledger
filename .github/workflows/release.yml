name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      # A dispatch can never publish: every publishing step below is also gated
      # on `refs/tags/v`, which a branch dispatch is not. Setting this to false
      # therefore does not turn a dispatch into a release — it packs either way.
      # Publishing happens by pushing a `v*` tag, and nothing else.
      dry-run:
        description: 'Pack and validate. Publishing only ever happens on a v* tag push, never from a dispatch.'
        type: boolean
        default: true

# id-token is what lets npm verify this run came from this repository, so no
# long-lived publish token has to exist anywhere. See
# https://docs.npmjs.com/trusted-publishers/ for the matching npm-side setup.
permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No dependency cache on purpose: a release build should not be able to
      # resolve anything stale. The only dependencies are the two test-only
      # React packages, and the package itself ships with none.
      #
      # Node 24, not 22: trusted publishing needs npm >= 11.5.1, and the npm
      # bundled with Node 22 is npm 10, which cannot do the OIDC exchange at
      # all. With npm 10 the publish went out unauthenticated and the registry
      # answered 404 Not Found - PUT, which reads like a missing package rather
      # than a missing credential. Every Release run from v0.5.0 to v0.8.0
      # failed on this step.
      #
      # registry-url is deliberately absent. It exists to write an
      # `_authToken` line into .npmrc for token auth, and that line is what
      # stops OIDC: npm reads it, concludes a credential is already configured,
      # and never asks for an OIDC token - failing with ENEEDAUTH, which reads
      # like "you forgot to log in" in a job that must never log in. See
      # actions/setup-node#1551. Without the input, setup-node writes nothing
      # and npm falls back to OIDC, which is the whole point of this workflow.
      # The registry is still registry.npmjs.org, by npm's own default.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install test-only React
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Verify packaging invariants
        run: npm run verify

      - name: Read the version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          pkg="${{ steps.version.outputs.value }}"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # A version that is already on the registry cannot be published again.
      # Detecting that keeps a tag re-push from failing the whole run, which
      # matters when a release was first published by hand with an OTP.
      - name: Is this version already published?
        id: published
        run: |
          set -eu
          if npm view "@chenmiao8563/dsh-token-ledger@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "@chenmiao8563/dsh-token-ledger@${{ steps.version.outputs.value }} is already on the registry"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "@chenmiao8563/dsh-token-ledger@${{ steps.version.outputs.value }} is not on the registry yet"
          fi

      # The failure this guards against is silent: a stored credential does not
      # break the publish loudly, it makes npm skip the OIDC exchange and then
      # complain about a missing login. Asserting the absence up front turns a
      # confusing auth error into a sentence that names the cause.
      - name: No stored credential, so npm has to use OIDC
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        run: |
          set -eu
          rc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$rc" ] && grep -q '_authToken' "$rc"; then
            echo "$rc still carries an _authToken line, which would make npm skip OIDC:"
            grep -n '_authToken' "$rc" | sed 's/=.*/=<redacted>/'
            exit 1
          fi
          echo "no _authToken in ${rc}: npm will authenticate with OIDC"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true && steps.published.outputs.value == 'false'
        run: |
          # A failed step's log needs a GitHub sign-in to read, which is a poor
          # place to put the one line that says what went wrong. On failure the
          # registry's own words are repeated as an annotation, and annotations
          # are readable from the run page by anyone.
          set +e
          npm --version
          npm publish --access public 2>&1 | tee "$RUNNER_TEMP/publish.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            reason=$(grep -E '^npm (error|notice|warn)' "$RUNNER_TEMP/publish.log" \
              | tail -n 12 | tr '\n' '|' | cut -c1-800)
            # npm's own debug log is where an attempted OIDC exchange would show
            # up, and whether one was attempted is the question this error
            # almost never answers.
            debug=$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1)
            trace=$(grep -iE 'oidc|token exchange|trusted' "$debug" 2>/dev/null \
              | tail -n 5 | tr '\n' '|' | cut -c1-500)
            echo "::error title=npm publish failed::(npm $(npm --version), OIDC request url ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}) ${reason} || from the debug log: ${trace:-nothing about OIDC}"
          fi
          exit "$status"

      # The release needs a tarball whether or not this run published one. When
      # the version is already on the registry the Publish step is skipped, so
      # nothing else would create the file that `gh release create` attaches —
      # which is exactly how the v0.1.0 release run failed.
      - name: Pack the tarball to attach
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        run: |
          npm pack
          ls -l *dsh-token-ledger-*.tgz

      - name: Pack only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || inputs.dry-run == true }}
        run: |
          npm pack
          ls -l *dsh-token-ledger-*.tgz

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent on purpose. `gh release create` fails with HTTP 422
          # `already_exists` when the tag already has a release, which turned
          # exactly the runs that had already succeeded into the red ones and
          # made "re-run this release" unusable.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release; uploading the tarball to it"
            gh release upload "$GITHUB_REF_NAME" *dsh-token-ledger-*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "See [CHANGELOG.md](CHANGELOG.md) for what changed." \
              *dsh-token-ledger-*.tgz
          fi

      # The Publish step is skipped when the version is already on the registry,
      # so a run can be green without having published anything. That is by
      # design — but it means "the run passed" and "the version is live" are
      # different sentences, and the v0.8.0 investigation lost time to exactly
      # that gap. This step makes the run assert the second one.
      - name: The version really is on the registry
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        run: |
          set -eu
          version="${{ steps.version.outputs.value }}"
          live=$(npm view "@chenmiao8563/dsh-token-ledger@$version" version 2>/dev/null || true)
          if [ "$live" != "$version" ]; then
            echo "::error title=not published::the run passed but @chenmiao8563/dsh-token-ledger@$version is not on the registry (npm view returned '${live:-nothing}')"
            exit 1
          fi
          echo "@chenmiao8563/dsh-token-ledger@$version is on the registry"
